<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Application Submitted</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #080b14;
            color: #f8fafc;
        }

        .card {
            width: 420px;
            padding: 42px;

            text-align: center;

            background: #101521;
            border: 1px solid #20283a;
            border-radius: 20px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
        }

        .icon {
            width: 72px;
            height: 72px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(53, 211, 153, .1);
            border: 1px solid rgba(53, 211, 153, .3);

            color: #35d399;
            font-size: 32px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        p {
            margin-top: 10px;
            color: #788398;
            font-size: 13px;
            line-height: 1.5;
        }

        .privacy {
            margin-top: 24px;
            padding: 12px;

            border-radius: 10px;

            background: rgba(53, 211, 153, .06);
            border: 1px solid rgba(53, 211, 153, .12);

            color: #7ee2b8;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icon">
            ✓
        </div>

        <h1>Application Submitted</h1>

        <p>
            Your application was successfully submitted
            by the VisionShield agent.
        </p>

        <div class="privacy">
            Privacy protection verified · Raw PII sent: 0
        </div>

    </div>

</body>

</html>
