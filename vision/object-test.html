<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        VisionShield Object Detection Test
    </title>

    <style>

    body {
        font-family: Arial, sans-serif;
        margin: 30px;
    }

    h1 {
        margin-bottom: 20px;
    }

    #status {
        padding: 12px;
        border: 1px solid #ccc;
        margin-bottom: 20px;
    }

    #imageContainer {
        position: relative;
        width: 600px;
        max-width: 100%;
        margin-bottom: 25px;
    }

    #imageContainer #testImage {
        width: 100%;
        display: block;
    }

    #detectionCanvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }

    #results {
        background: #f5f5f5;
        padding: 15px;
        white-space: pre-wrap;
        overflow-x: auto;
        border: 1px solid #ddd;
    }

</style>

</head>


<body>

    <h1>
        VisionShield Object Detection Test
    </h1>


    <div id="status">
        Starting object detection test...
    </div>


    <div id="imageContainer">

    <img
        id="testImage"
        src="https://huggingface.co/datasets/Xenova/transformers.js-docs/resolve/main/cats.jpg"
        alt="Object detection test image"
    >

    <canvas id="detectionCanvas"></canvas>

</div>


    <h2>
        Detection Results
    </h2>


    <pre id="results">
Waiting for detection...
    </pre>


    <!-- IMPORTANT:
         Load the bundled JavaScript file -->
    <script
        type="module"
        src="./object-test.bundle.js"
    ></script>

</body>

</html>
