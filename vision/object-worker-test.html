<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        VisionShield Object Worker Test
    </title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            margin-bottom: 20px;
        }

        #status {
            padding: 12px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }

        #testImage {
            width: 600px;
            max-width: 100%;
            display: block;
            margin-bottom: 25px;
        }

        #results {
            background: #f5f5f5;
            padding: 15px;
            white-space: pre-wrap;
            overflow-x: auto;
            border: 1px solid #ddd;
        }

    </style>

</head>


<body>

    <h1>
        VisionShield Object Worker Test
    </h1>


    <div id="status">
        Starting worker test...
    </div>


    <img
        id="testImage"
        src="https://huggingface.co/datasets/Xenova/transformers.js-docs/resolve/main/cats.jpg"
        alt="Object detection test image"
    >


    <h2>
        Worker Detection Results
    </h2>


    <pre id="results">
Waiting for worker...
    </pre>


    <script
        type="module"
        src="./object-worker-test.bundle.js"
    ></script>

</body>

</html>
